[project]
name = "spakie"
version = "0.1.0"
description = "Text-to-pixel-art masked discrete diffusion model, trained from scratch in MLX"
requires-python = ">=3.12"
dependencies = [
    "mlx>=0.30",
    "numpy>=2.0",
    "pillow>=10.0",
    "tokenizers>=0.20",
]

[project.scripts]
spakie-prepare = "spakie.data.prepare:main"
spakie-train = "spakie.train:main"
spakie-sample = "spakie.sample:main"
spakie-eval = "spakie.eval:main"
spakie-web = "spakie.web:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spakie"]

[tool.pytest.ini_options]
testpaths = ["tests"]
